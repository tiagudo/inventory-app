<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="refresh" content="3;url=." />
<title>Inventory Control</title>
<style>
  :root {
    --green: #1D9E75;
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --text: #1a1a1a;
    --text2: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --bg2: #2c2c2e; --text: #f2f2f7; --text2: #aeaeb2; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg2); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); display: flex; align-items: center; justify-content: center; }
  .card { background: var(--bg); border-radius: 14px; padding: 40px 32px; text-align: center; max-width: 320px; width: 90%; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 24px; }
  a { display: inline-block; padding: 11px 28px; background: #E1F5EE; color: #0F6E56; border: 0.5px solid #5DCAA5; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; }
  a:active { opacity: .75; }
  .countdown { font-size: 12px; color: var(--text2); margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📦</div>
  <h1>Page not found</h1>
  <p>This page doesn't exist. Redirecting you back to the Inventory app…</p>
  <a href=".">Go to app</a>
  <div class="countdown" id="cd">Redirecting in 3 seconds…</div>
</div>
<script>
  let n = 3;
  const el = document.getElementById('cd');
  const t = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(t); el.textContent = 'Redirecting…'; }
    else el.textContent = `Redirecting in ${n} second${n !== 1 ? 's' : ''}…`;
  }, 1000);
</script>
</body>
</html>
